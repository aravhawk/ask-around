# PRD section 7 format. `match` rules are applied by Kai-4 while planning;
# plain-keyword rules (like "hotel") are also enforced deterministically after planning.
rules:
  - match: "money > 200"
    owners: [mom, dad]
    quorum: 2
  - match: "hotel"
    owners: [dad]
    quorum: 1
defaults: { expires_s: 30, veto_on_deny: true, max_reasks: 1, max_replans: 2 }
