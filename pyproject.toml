[project]
name = "askaround"
version = "0.1.0"
description = "Governance for agents that ask people: quorum, veto, escalation and receipts on Notify."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "rich>=13", "pyyaml>=6", "pydantic>=2"]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
askaround = "askaround.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["askaround"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
